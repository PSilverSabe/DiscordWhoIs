name: Deploy discordwhois

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deploy only if relevant files changed
      - name: Check for relevant changes
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E "src/|Dockerfile|docker-compose.yml" || true)
          if [ -z "$CHANGED" ]; then
            echo "No relevant changes detected. Skipping deployment."
            exit 0
          fi
          echo "Changes detected:"
          echo "$CHANGED"

      # Setup SSH key
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # Add VPS host key to known_hosts
      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Upload project files to VPS
      - name: Upload project to VPS
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/discordwhois/

      # Build and deploy using Docker Compose
      - name: Build and deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/${{ secrets.VPS_USER }}/discordwhois && docker compose up -d --build && ./swap.sh"
