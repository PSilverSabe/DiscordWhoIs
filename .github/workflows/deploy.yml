name: Deploy discordwhois

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup SSH private key
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # Add VPS host to known_hosts
      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # ============================
      # BUILD IMAGES
      # ============================

      - name: Build Web image
        run: docker build -t discordwhois_web:latest -f DiscordWhoIs/Dockerfile.web .

      - name: Build Worker image
        run: docker build -t discordwhois_worker:latest -f DiscordWhoIs/Dockerfile.worker .

      # ============================
      # SAVE IMAGES
      # ============================

      - name: Save docker images as tarballs
        run: |
          docker save discordwhois_web:latest -o discordwhois_web.tar
          docker save discordwhois_worker:latest -o discordwhois_worker.tar

      # ============================
      # UPLOAD TO VPS
      # ============================

      - name: Upload images to VPS
        run: |
          scp discordwhois_web.tar \
              discordwhois_worker.tar \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/discordwhois/

      # ============================
      # DEPLOY VIA swap.sh
      # ============================

      - name: Load images & run swap.sh
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ~/discordwhois

            echo 'Loading Docker images...'
            docker load -i discordwhois_web.tar
            docker load -i discordwhois_worker.tar

            echo 'Running blue/green swap...'
            cd ~/discordwhois.variables
            chmod +x swap.sh
            ./swap.sh
          "
