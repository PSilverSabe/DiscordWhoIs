name: Deploy discordwhois

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup SSH private key (must match authorized_keys on VPS)
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # Add VPS host to known_hosts (prevents prompt)
      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Build Docker image on GitHub Actions
      - name: Build Docker image
        run: docker build -t discordwhois:latest -f DiscordWhoIs/Dockerfile .

      # Save Docker image as a tarball
      - name: Save Docker image to tar
        run: docker save discordwhois:latest -o discordwhois.tar

      # Upload built Docker image tarball
      - name: Upload Docker image to VPS
        run: |
          scp discordwhois.tar \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/discordwhois/

      # Load image and run deployment script
      - name: Load image and run swap.sh
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ~/discordwhois
            # Load docker image
            docker load -i discordwhois.tar

            # Run swap.sh inside variables/
            cd ~/discordwhois.variables
            chmod +x swap.sh
            ./swap.sh
          "
